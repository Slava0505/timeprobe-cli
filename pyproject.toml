[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "timeprobe-cli"
dynamic = ["version"]
description = "A stopwatch CLI with an optional time target and short session history"
readme = "readme.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
keywords = ["stopwatch", "cli", "time-tracking"]

[project.scripts]
timeprobe = "timeprobe.cli:main"

[project.urls]
Source = "https://github.com/Slava0505/timeprobe-cli"
Upstream = "https://github.com/MaVericKWareZ/chime"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0+source"

[tool.hatch.build.targets.wheel]
packages = ["src/timeprobe"]

[tool.hatch.build.targets.sdist]
include = ["src/timeprobe", "tests", "readme.md", "LICENSE", "changelog.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
